<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in · LTA RMWP</title><link rel="stylesheet" href="login.css"></head>
<body><main class="login-layout"><section class="city" aria-label="Interactive Singapore transport scene"><div id="scene"></div><div id="scene-fallback" hidden>Singapore transport scene is unavailable.</div><span id="scene-status" role="status" hidden></span></section><section class="login-panel"><div class="login-content"><img class="logo" src="logo_color.png" alt="Land Transport Authority"><form id="login-form"><label for="username">User name</label><input id="username" autocomplete="username" placeholder="Enter your user name"><label for="password">Password</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password" placeholder="Enter your password"><button type="button" id="show-password" aria-label="Show password"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div><div class="form-options"><label class="remember"><input type="checkbox">Remember me</label><button type="button" class="text-link" data-auth>Forgot password?</button></div><button class="primary" type="submit">Log in</button><div class="divider">or continue with</div><button class="alternative singpass" type="button" data-auth>singpass</button><button class="alternative" type="button" data-auth>Log in with WOG</button><p id="form-status" role="status"></p></form><p class="terms">By logging in, you agree to LTA<br><button type="button" class="legal-link">Terms of Use</button> and <button type="button" class="legal-link">Privacy Statement</button></p></div><footer>© Land Transport Authority</footer></section></main><script src="login-scene.bundle.js" onerror="document.getElementById('scene-status').textContent='Unable to load the city. Please reload this page.';document.getElementById('scene-fallback').hidden=false"></script><script>
const password=document.querySelector('#password');document.querySelector('#show-password').onclick=function(){const show=password.type==='password';password.type=show?'text':'password';this.setAttribute('aria-label',show?'Hide password':'Show password')};document.querySelector('#login-form').onsubmit=e=>e.preventDefault();
</script></body></html>
